[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# one crypto provider for every TLS connection (WebSocket and HTTP); without it the first wss:// connection fails
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
httparse = "1"
# wallet key at rest (v1 format of the operator): decrypted in memory only, wiped on drop
scrypt = { version = "0.11", default-features = false }
aes-gcm = "0.10"
zeroize = "1"
base64 = "0.22"

[dev-dependencies]
proptest = "1"
