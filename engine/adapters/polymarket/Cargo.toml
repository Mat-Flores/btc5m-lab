[package]
name = "adapter-polymarket"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
engine-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
proptest = "1"
