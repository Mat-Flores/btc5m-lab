[package]
name = "engine-app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../core" }
adapter-polymarket = { path = "../adapters/polymarket" }
adapter-chainlink = { path = "../adapters/chainlink" }
adapter-okx = { path = "../adapters/okx" }
adapter-binance = { path = "../adapters/binance" }
adapter-coinbase = { path = "../adapters/coinbase" }
engine-strategy = { path = "../strategy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "signal"] }
